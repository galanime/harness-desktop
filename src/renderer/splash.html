<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root {
        --bg: #0f1117;
        --ink: #e8eaf2;
        --dim: #8b90a3;
        --brand: #4d6bfe;
        --accent: #5eead4;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(77, 107, 254, 0.18), transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        user-select: none;
      }
      .logo { width: 132px; height: 132px; filter: drop-shadow(0 12px 40px rgba(77, 107, 254, 0.35)); }
      .name { font-size: 26px; font-weight: 650; letter-spacing: 0.4px; }
      .name em { font-style: normal; color: var(--brand); }
      .tagline { color: var(--dim); font-size: 13.5px; }
      .spinner {
        width: 26px; height: 26px;
        border: 2.5px solid rgba(139, 144, 163, 0.25);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-top: 6px;
      }
      .footer { position: absolute; bottom: 22px; color: #5b6072; font-size: 12px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <svg class="logo" viewBox="0 0 1024 1024" aria-label="logo">
      <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#g)" />
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2a2f6e" />
          <stop offset="1" stop-color="#4d6bfe" />
        </linearGradient>
      </defs>
      <g fill="none" stroke="rgba(255,255,255,0.92)" stroke-linecap="round">
        <rect x="316" y="300" width="120" height="424" rx="60" fill="rgba(255,255,255,0.92)" stroke="none" />
        <rect x="588" y="300" width="120" height="424" rx="60" fill="rgba(255,255,255,0.92)" stroke="none" />
        <rect x="300" y="440" width="424" height="144" rx="60" fill="rgba(255,255,255,0.92)" stroke="none" />
        <rect x="560" y="478" width="76" height="68" rx="12" fill="#2a2f6e" stroke="none" />
      </g>
      <path d="M180 512 a332 332 0 0 1 150 -268" stroke="rgba(94,234,212,0.9)" stroke-width="46" />
      <path d="M844 512 a332 332 0 0 1 -150 -268" stroke="rgba(94,234,212,0.9)" stroke-width="46" />
      <circle cx="812" cy="794" r="34" fill="#5eead4" />
    </svg>
    <div class="name">DeepSeek <em>Harness</em> Desktop</div>
    <div class="tagline">正在启动本地 harness 服务…（首次启动需初始化，请稍候）</div>
    <div class="spinner"></div>
    <div class="footer">独立社区桌面端 · 与 github.com/deepseek-ai/deepseek-harness 保持同步</div>
  </body>
</html>
