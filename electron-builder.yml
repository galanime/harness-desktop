appId: com.galanime.deepseek-harness-desktop
productName: DeepSeek Harness Desktop
copyright: "Copyright © 2026 galanime and DeepSeek Harness Desktop contributors. DeepSeek Harness is © DeepSeek (MIT)."
artifactName: "DeepSeek-Harness-Desktop-${version}-${arch}.${ext}"

directories:
  output: dist
  buildResources: build

files:
  - "src/**/*"
  - "package.json"
  - "!**/*.map"
  - "!**/*.md"

asar: true

extraResources:
  # 注意：electron-builder 会排除 from 根级 node_modules，
  # 因此所有载荷（依赖）统一下沉到 lib/ 子目录。
  - from: "harness-runtime"
    to: "harness-runtime"
    filter:
      - "lib/**"
  - from: "mcp/qwen-vision-mcp"
    to: "vision-mcp"
    filter:
      - "lib/**"
  - from: "brand"
    to: "brand"
    filter:
      - "logo.svg"
      - "icon.png"
      - "trayTemplate.png"
      - "trayTemplate@2x.png"
      - "LICENSE.txt"
      - "NOTICE.txt"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSHumanReadableCopyright: "Copyright © 2026 galanime. DeepSeek Harness is © DeepSeek (MIT)."
    LSApplicationCategoryType: public.app-category.developer-tools

dmg:
  title: "${productName} ${version}"
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  background: build/dmg-background.png
  window:
    width: 540
    height: 400

publish:
  provider: github
  owner: galanime
  repo: harness-desktop
  releaseType: release
