<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F6E"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1C2050"/>
      <stop offset="1" stop-color="#5B78FF"/>
    </linearGradient>
  </defs>

  <!-- 底：圆角方形，驭架蓝渐变 -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="url(#edge)" stroke-width="8"/>

  <!-- 同步弧：两段青色弧线，象征与上游 GitHub 持续同步 -->
  <path d="M172 500 A 340 340 0 0 1 330 236" fill="none" stroke="#5EEAD4" stroke-width="48" stroke-linecap="round" opacity="0.92"/>
  <path d="M852 500 A 340 340 0 0 1 694 236" fill="none" stroke="#5EEAD4" stroke-width="48" stroke-linecap="round" opacity="0.92"/>

  <!-- H 形缰绳标记：两条竖带 + 横带，白色 -->
  <rect x="316" y="296" width="122" height="432" rx="61" fill="#FFFFFF"/>
  <rect x="586" y="296" width="122" height="432" rx="61" fill="#FFFFFF"/>
  <rect x="296" y="436" width="432" height="152" rx="66" fill="#FFFFFF"/>

  <!-- 横带上的扣孔（缰绳卡扣），露出底色 -->
  <rect x="562" y="476" width="78" height="72" rx="14" fill="#2A2F6E"/>

  <!-- 本地模型节点：右下角青色圆点（千问本地推理） -->
  <circle cx="806" cy="792" r="36" fill="#5EEAD4"/>
  <circle cx="806" cy="792" r="36" fill="none" stroke="#0F1117" stroke-opacity="0.18" stroke-width="6"/>
</svg>
